<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RS Cinta Kasih Tzu Chi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        plasma: { bg: '#050814', card: '#0b132b', border: '#1e293b', accent: '#3b82f6' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050814; color: #f1f5f9; }
        .card-plasma { background: #0b132b; border: 1px solid #1e293b; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5); }
        
        @keyframes slideDownBounce {
            0% { transform: translateY(-40px) scale(0.9); opacity: 0; }
            60% { transform: translateY(6px) scale(1.02); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes fadeOutUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-20px) scale(0.95); opacity: 0; }
        }
        .toast-enter {
            animation: slideDownBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .toast-exit {
            animation: fadeOutUp 0.3s ease-in forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-screen overflow-hidden antialiased selection:bg-blue-600 selection:text-white">

    <div id="toast-container" class="fixed top-8 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-full max-w-sm px-4"></div>

    <div class="w-full max-w-md p-6">
        <div class="text-center mb-6">
            <div class="inline-flex w-12 h-12 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl items-center justify-center shadow-lg shadow-blue-500/20 mb-3">
                <i class="fa-solid fa-hospital text-lg text-white"></i>
            </div>
            <h1 class="text-base font-black tracking-wider text-white">RS CINTA KASIH TZU CHI</h1>
            <p class="text-xs text-slate-400 mt-1">Buat akun Anda</p>
        </div>

        <div class="card-plasma p-6 rounded-2xl">
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <i class="fa-solid fa-user text-xs"></i>
                        </span>
                        <input type="text" name="username" required 
                            class="w-full bg-[#050814] border border-slate-800 rounded-xl px-3 py-2.5 pl-9 text-xs text-slate-200 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" name="password" required 
                            class="w-full bg-[#050814] border border-slate-800 rounded-xl px-3 py-2.5 pl-9 text-xs text-slate-200 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 rounded-xl shadow-lg shadow-blue-600/30 transition mt-2">
                    Daftar Akun 
                </button>
            </form>

            <div class="mt-5 text-center text-xs text-slate-400 border-t border-slate-800/80 pt-4">
                Sudah punya akun? 
                <a href="/login" class="text-blue-400 font-semibold hover:underline">Masuk di sini</a>
            </div>
        </div>

        <div class="text-center text-[10px] text-slate-600 mt-6">&copy; 2026 SIMRS IT Department</div>
    </div>

    <script>
        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const isSuccess = type === 'success';
            toast.className = `flex items-center gap-3 px-5 py-3.5 rounded-2xl border shadow-2xl text-xs font-semibold pointer-events-auto toast-enter ${
                isSuccess 
                    ? 'bg-[#0b132b]/95 backdrop-blur-md border-emerald-500/50 text-emerald-300 shadow-emerald-950/60' 
                    : 'bg-[#0b132b]/95 backdrop-blur-md border-rose-500/50 text-rose-300 shadow-rose-950/60'
            }`;
            
            const icon = isSuccess 
                ? '<i class="fa-solid fa-circle-check text-sm text-emerald-400"></i>' 
                : '<i class="fa-solid fa-circle-exclamation text-sm text-rose-400"></i>';
                
            toast.innerHTML = `${icon}<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = e.target.username.value;
            const password = e.target.password.value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1200);
                } else {
                    showNotification(result.message, 'error');
                }
            } catch (err) {
                showNotification('Gagal terhubung ke server backend.', 'error');
            }
        });
    </script>
</body>
</html>
